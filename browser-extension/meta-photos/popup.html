<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фото до AI-розмальовок</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Фото до AI-розмальовок</h1>
    <p>Відкрийте діалог і ввімкніть кнопки вибору на фото.</p>
  </header>
  <main>
    <div class="actions">
      <button id="scan" type="button">Показати кнопки в чаті</button>
      <button id="select-all" type="button" class="secondary" disabled>Вибрати видимі</button>
    </div>
    <p class="hint">Натискайте + на фото у відкритому чаті. Прокручуйте історію, щоб вибрати інші. Відкрийте розширення знову для передачі.</p>
    <label class="field">Ім’я клієнта (необов’язково)
      <input id="customer" type="text" maxlength="80" placeholder="Наприклад, Марія">
    </label>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="photos" class="photos"></div>
    <button id="send" type="button" class="send" disabled>Передати в AI (0)</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
